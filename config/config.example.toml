# StateSense-Agent V0 配置模板
# 复制为 config/config.toml 后按需修改。密钥不放这里，走环境变量。

[screenpipe]
base_url = "http://localhost:3030"
api_key_env = "SCREENPIPE_LOCAL_API_KEY"
request_timeout_sec = 10

[schedule]
tick_seconds = 60
evaluate_every_minutes = 5
window_minutes = 60

[thresholds]
watch_minutes = 20
passive_minutes = 40
high_risk_minutes = 65
late_night_start_hour = 1
late_night_end_hour = 6
late_night_min_active_minutes = 10

[gate]
enabled = ["state_min", "ratio_min", "cooldown", "daily_cap"]
# ratio_min 必填：娱乐分钟 / 总活跃分钟。
# 60 分钟窗口内 ent>=40 已隐含 ratio>=0.667，故有效区间是 (0.667, 1]。
# 0.75 约等于把生效门槛抬到「活跃满 60 分钟时娱乐 >= 45 分钟」。
ratio_min = 0.75
cooldown_minutes = 30
daily_cap = 8

[outcome]
delay_minutes = 10
disengaged_ratio = 0.5
continued_ratio = 0.8

[notify]
# 前台弹窗。不用 Windows Toast 的原因：本机全局通知开关是关的，
# 且 Windows 在全屏应用下默认抑制通知 —— 而本项目核心场景正是全屏刷视频。
# MessageBox 绕开通知平台，加显式抢前台后全屏可见，且不需要注册 AUMID。
channel = "foreground_popup"
# 用户完全不理会时，多久自动关掉弹窗（秒）
answer_timeout_seconds = 180
# 轮询对话框句柄、强行抢前台的最长等待（秒）
foreground_timeout_seconds = 15

[store]
path = "statesense.db"

[report]
# 连续性阈值，同时用于两个判定（语义不同但阈值相同，故不设两个键）：
#   · 回看历史：相邻评估的间隔超过它 → 记为一处缺口
#   · 判断当下：最后一条评估距今超过它 → 视为掉线
# 默认 = 3 × schedule.evaluate_every_minutes
gap_threshold_minutes = 15
# 漏判锚点：窗口活跃至少这么多分钟，才值得怀疑规则漏掉了什么
leak_min_active_minutes = 30
# 漏判锚点：未归类占比至少这么高
leak_min_unclassified_ratio = 0.7
# 二级漏判视图最多列几条明细
leak_top_n = 10

[taxonomy]
# ⚠️ 平台名 ≠ 游戏名。
# Steam / Epic 启动的游戏，进程名与窗口标题都是游戏自身，不含 "steam" 等平台关键词 ——
# 只写平台名会漏掉它们。实测：刷 Brotato 46.9 分钟被判成 NORMAL（ent=0），
# 因为清单里有 "steam" 却没有 "brotato"。
# 所以下面既有平台名（能命中商店页），也要按需补上实际在玩的游戏名。
# 发现清单缺口的常规手段：python -m statesense --report --views 5
entertainment = [
  "bilibili", "哔哩哔哩", "B站", "douyin", "抖音", "tiktok", "youtube",
  "iqiyi", "爱奇艺", "youku", "优酷", "v\\.qq\\.com", "腾讯视频", "mgtv", "芒果TV",
  "netflix", "disney\\+", "hbo", "twitch", "kuaishou", "快手",
  "xiaohongshu", "小红书", "weibo", "微博",
  "steam", "epic games", "battle\\.net", "wegame", "明日方舟",
  "网易云音乐", "qq音乐", "spotify", "酷狗", "酷我",
]
gray = ["知乎", "zhihu", "豆瓣", "douban", "贴吧", "tieba", "reddit", "news", "新闻"]
work = [
  "github", "gitlab", "stackoverflow", "docs\\.python", "readthedocs", "developer\\.mozilla",
  "\\bcode\\b", "zed", "pycharm", "cursor", "trae", "idea", "terminal", "powershell",
  "bash", "cmd\\.exe", "figma", "blender", "unity", "godot",
]

[[actions]]
id = "walk5"
text = "离开电脑走 5 分钟"
applies_to = ["PASSIVE_CONSUMPTION", "HIGH_RISK_PASSIVE_CONSUMPTION"]

[[actions]]
id = "calligraphy"
text = "练字 5 分钟"
applies_to = ["PASSIVE_CONSUMPTION", "HIGH_RISK_PASSIVE_CONSUMPTION"]

[[actions]]
id = "stretch"
text = "起来做一组拉伸"
applies_to = ["PASSIVE_CONSUMPTION", "HIGH_RISK_PASSIVE_CONSUMPTION"]

[[actions]]
id = "reading"
text = "读一段《道德经》"
applies_to = ["HIGH_RISK_PASSIVE_CONSUMPTION"]
